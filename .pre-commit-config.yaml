repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: poetry run ruff check --force-exclude
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff-format
        name: Ruff format check
        entry: poetry run ruff format --check --force-exclude
        language: system
        types: [python]
        pass_filenames: true