name: China Calc CD

on:
  workflow_run:
    workflows:
      - China Calc CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production

    if: github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Настройка SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/chinacalc_deploy
          chmod 600 ~/.ssh/chinacalc_deploy
          
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy на production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

        run: |
          ssh \
            -i ~/.ssh/chinacalc_deploy \
            "$DEPLOY_USER@$DEPLOY_HOST" << 'EOF'
          
          set -eu
              
          cd /opt/chinacalc
          
          echo "Получение новой версии"
          git fetch origin main

          echo "Обновление production до origin/main"
          git reset --hard origin/main
          
          echo "Сборка и запуск контейнеров"
          docker compose -f compose.prod.yml up \
            -d \
            --build \
            --remove-orphans
          
          echo "Ожидание запуска приложения"
          sleep 10
          
          echo "Состояние контейнеров:"
          docker compose -f compose.prod.yml ps
          
          echo "Проверка web-контейнера"
          
          if ! docker compose -f compose.prod.yml \
            ps --status running --services | grep -qx web
          then
            echo "Web-контейнер не запущен"
          
            docker compose -f compose.prod.yml \
              logs --tail=100 web
            
            exit 1
          fi
          
          echo "Deploy успешно завершен"
          
          EOF