[tool.poetry]
name = "chinacalcproject"
version = "0.1.0"
description = ""
authors = ["dima <dima.arti@mail.ru>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
django = "^6.0.7"
psycopg2-binary = "^2.9.12"
django-environ = "^0.14.0"
ipython = "^9.15.0"
django-extensions = "^4.1"
django-crispy-forms = "^2.6"
crispy-bootstrap5 = "^2026.3"
django-debug-toolbar = "^7.0.0"
openpyxl = "^3.1.5"
redis = "^8.0.1"
pytest-django = "^4.14.0"
gunicorn = "^26.2.0"


[tool.poetry.group.dev.dependencies]
ruff = "^0.16.0"
pre-commit = "^4.6.2"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["RUF012"]

[tool.ruff]
line-length = 90
target-version = "py314"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
