{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h1 class="h4 mb-0">
                        Вход в калькулятор
                    </h1>
                </div>

                <div class="card-body">
                    {% if form.errors %}
                    <div class="alert alert-danger">
                        Неверное имя пользователя или пароль
                    </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}

                        {{ form|crispy }}

                        {% if next %}
                        <input
                                type="hidden"
                                name="next"
                                value="{{ next }}"
                        >
                        {% endif %}

                        <button
                                type="submit"
                                class="btn btn-primary w-100 bg-dark"
                        >
                            Войти
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
