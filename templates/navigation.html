<nav
        class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm"
>
    <div class="container">

        <a
                class="navbar-brand fw-semibold"
                href="{% url 'shipment:list' %}"
        >
            Доставка из Китая
        </a>

        <div
                class="collapse navbar-collapse"
                id="mainNavbar"
        >

            {% if user.is_authenticated %}

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a
                            class="nav-link
                            {% if request.resolver_match.url_name == 'list' and request.resolver_match.namespace == 'shipment' %}
                                active
                            {% endif %}"
                            href="{% url 'shipment:list' %}"
                    >
                        Поставки
                    </a>
                </li>

                <li class="nav-item">
                    <a
                            class="nav-link
                            {% if request.resolver_match.namespace == 'client' %}
                                active
                            {% endif %}"
                            href="{% url 'client:list' %}"
                    >
                        Клиенты
                    </a>
                </li>

                <li class="nav-item">
                    <a
                            class="nav-link
                            {% if request.resolver_match.namespace == 'list' %}
                                active
                            {% endif %}"
                            href="{% url 'finance:list' %}"
                    >
                        Курсы валют
                    </a>
                </li>

            </ul>

            <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-3">

                    <span class="navbar-text text-light">
                        {{ user.email }}
                    </span>

                <form
                        method="post"
                        action="{% url 'account:logout' %}"
                        class="mb-0"
                >
                    {% csrf_token %}

                    <button
                            type="submit"
                            class="btn btn-sm btn-outline-danger"
                    >
                        Выйти
                    </button>
                </form>

            </div>

            {% else %}

            <div class="ms-lg-auto mt-3 mt-lg-0">
                <a
                        href="{% url 'account:login' %}"
                        class="btn btn-outline-light"
                >
                    Войти
                </a>
            </div>

            {% endif %}
        </div>
    </div>
</nav>
